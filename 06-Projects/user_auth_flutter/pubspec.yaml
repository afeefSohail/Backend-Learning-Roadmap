name: user_auth
description: Login, register, profile and photos. One Dart codebase for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3        # state management (@Observable / @Environment equivalent)
  dio: ^5.11.1                    # HTTP client with interceptors (token refresh)
  flutter_secure_storage: ^11.2.0 # Keychain on iOS, Keystore-backed storage on Android
  image_picker: ^1.2.4            # photo picker, multi-select works on BOTH platforms

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
