name: Express Project
services:

  # PostgreSQL Service
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser 
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432" # Expose PostgresSQL on port 5433:5432

# Express API Service
  express-api:
      build: 
        context: .
      container_name: express_api
      restart: always
      ports:
        - "3000:3000" # Expose Express on port 3000
        - "5556:5555" # Expose Prisma Studio on port 5555
      depends_on:
        - postgres # Ensure PostgreSQL starts before Express API
      environment:
        DATABASE_URL: "postgresql://myuser:mypassword@postgres:5432/mydatabase?schema=public"
      volumes:
       - ./express-api:/app # Mount project directory(local express-api) inside the container
       - node_modules:/app/node_modules # named volume instead of an anonymous one
      command: 
        - sh # Bash Shell 
        - -c # Commqand Scripting
        - | # | or > multi line operators in 
          # check if the project already exists by looking for package.json
          # -f Means (The File Check)
          # Create index.js if it does noy exist
          if [ ! -f index.js ]; then
            echo 'const express = require("express");' > index.js
            echo 'const app = express();' >> index.js
            echo 'app.get("/", (req, res) => res.send("Hello, Docker!"));' >> index.js
            echo 'app.listen(3000, () => console.log("Server running on port 3000"));' >> index.js

            # These are structural keywords from Bash / Shell scripting.  
          fi # fi is simply if spelled backward. it marks the absolute end of the condition.            
          


          # Deleting existing migration folder...
          if [ ! -d "prisma/migrations" ]; then
            echo 'No migrations found. Creating initial migration...'
            npx prisma migrate dev --name init
          else
            echo 'Applying any pending migrations...'
            npx prisma migrate deploy
          fi

          npx prisma generate
          
          npx prisma studio -b none --port 5555 &

          # Start the Express app
          # node index.js  
          npm run dev

volumes:
  node_modules:




 
